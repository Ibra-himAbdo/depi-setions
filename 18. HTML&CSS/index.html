<!doctype html>
<html>
  <head>
    <title>My First Web Page</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="logo" />
      </a>
      <div class="header-link">
        <a href="index.html">Home</a>
        <a href="#">Out shop</a>
        <a href="#">Product details</a>
        <a href="Contanct.html">Contact us</a>
        <button type="button" class="btn">Sign in</button>
      </div>
    </div>

    <!-- landing-page -->
    <div class="landing-page">
      <div class="left-side">
        <p class="welcome">Welcome to NEXUS</p>
        <h1 class="slogon">best gaming site ever!</h1>
        <p class="description">
          NEXUS Gaming is a modern, simple website template for learning HTML &
          CSS. Explore trending games, discover top categories, and build your
          gaming journey today.
        </p>
        <div class="search-bar">
          <input type="text" placeholder="Search Games..." />
          <button type="button" class="btn search-bar-btn">Search</button>
        </div>
      </div>
      <div class="image-container">
        <img src="images/banner-image.jpg" alt="banner" />
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
