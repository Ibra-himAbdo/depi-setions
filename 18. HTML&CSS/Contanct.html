<!doctype html>
<html>
  <head>
    <title>My First Web Page</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card" style="max-width: 400px; margin: auto">
      <div class="card-body">
        <form id="my-form">
          <div class="mb-2">
          <label for="Email">Email</label>
          <input
            type="email"
            id="Email"
            name="Email"
            required
            class="form-control"
            placeholder="Enter your email.."
          />
        </div>
        <div class="mb-2">
          <label for="password">password</label>
          <input
            type="password"
            id="password"
            required
            name="password"
            class="form-control"
            placeholder="Enter your password.."
          />
        </div>
        <div class="d-flex align-items-end justify-content-end my-2">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </div>
        </form>
    </div>

    <input type="number" id="counter" class="form-control" value="0"/>
    <button type="button" id="plus-btn" class="btn btn-primary">+</button>
    <button type="button" id="minus-btn" class="btn btn-primary">-</button>

    <script>
        var counter = document.getElementById("counter");
        var plusBtn = document.getElementById("plus-btn");
        var minusBtn = document.getElementById("minus-btn");

        plusBtn.addEventListener("click" ,function () {
            counter.value++;
        })
        minusBtn.addEventListener("click" ,function () {
            var inputValue = Number(counter.value);
            if(counter.value <= 0)
            {
                alert("Value is already 0");
                return;
            }
            counter.value--;
        })
        

    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
